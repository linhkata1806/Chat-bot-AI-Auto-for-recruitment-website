name: rms-chatbot
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a random local key in .env}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_SSRF_ALLOWED_HOSTNAMES: host.docker.internal
      N8N_SSRF_BLOCKED_IP_RANGES: default,0.0.0.0/0,::/0
      N8N_DEFAULT_BINARY_DATA_MODE: default
      N8N_PAYLOAD_SIZE_MAX: 6
      N8N_FORMDATA_FILE_SIZE_MAX: 5
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: 180
      N8N_AI_TIMEOUT_MAX: 120000
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 2
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_LOG_LEVEL: warn
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/integration:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  n8n_data:
